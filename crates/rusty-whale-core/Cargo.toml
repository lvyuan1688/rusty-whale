[package]
name = "rusty-whale-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core agent loop, state machine, tool dispatch for rusty-whale"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
